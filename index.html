<body>
<main class="app">
  <header><div class="brand"><div class="brand-icon">✳</div><div><small>INCHEON PEACE CAMP</small>인천 피스캠프</div></div><div class="header-actions"><button class="header-action" id="profileBtn">참가자 정보</button><button class="header-action" id="helpBtn">이용 안내</button></div></header>
  <section class="hero"><div class="eyebrow">섬에서 찾은 나의 평화 · 인천 피스캠프</div><h1>평화의 길을 걸으며<br>섬의 이야기를 만나세요</h1><p>운서역에서 신도평화대교를 건너 수기해변까지</p><div class="meta-row"><span class="pill">📅 11.07–08</span><span class="pill">📍 약 5km 트레킹</span><span class="pill">🧩 GPS 퀴즈</span><span class="pill">🏕 신·시·모도</span></div></section>
  <section class="progress-wrap"><div class="progress-top"><strong>오늘의 여정</strong><span id="progressText">포인트 0 / 0</span></div><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div></section>
  <section class="map-shell"><div class="map-head"><div class="map-title">평화길 지도</div><div class="map-tools"><div class="gps-status"><i class="dot" id="gpsDot"></i><span id="gpsText">위치 연결 전</span></div><button id="soundBtn" class="sound-toggle" aria-label="퀴즈 알림음 끄기" aria-pressed="true" title="퀴즈 알림음">🔊</button></div></div><div class="map-box"><div id="map"></div><button class="map-fab" id="recenter" aria-label="내 위치로 이동">◎</button></div></section>
  <div class="section-title"><h2>트레킹 포인트</h2><span id="pointCount">경로 준비 중</span></div><section class="stops" id="stopList"></section>
  <div class="notice"><b>안전하게 걸어주세요.</b> GPS 퀴즈는 포인트 반경 안에 들어오면 나타납니다. 길을 걸으며 화면을 보지 말고, 멈춘 뒤 퀴즈를 풀어주세요.</div>
  <div class="bottom-bar"><button class="primary" id="startBtn">위치 연결하고 시작하기<span class="bottom-label">위치 권한을 허용해 주세요</span></button><button class="secondary" id="shareBtn" aria-label="공유">↗</button></div>
</main>
<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// 실제 GPS 경로 좌표를 받기 전까지 지도에는 경로선을 표시하지 않습니다.
const CONFIG={event:{title:'인천 피스캠프',date:'2026-11-07'},route:[],transfer:[],points:[
  {id:'P1',name:'운서역 광장 횡단보도 앞',loc:[37.49347069143585,126.49289547774978],mode:'walk',quiz:{question:'인천시에서 주최·주관하며 백패킹을 통해 자연과 평화의 가치를 체험하는 이번 행사의 이름은 무엇일까요?',choices:['인천아일랜드투어','인천피스캠프','인천평화트레킹','인천섬투어'],answer:1,explanation:'정답은 인천피스캠프입니다. 평화길 트레킹을 시작해 볼까요?'}},
  {id:'P2',name:'신도평화대교 입구',loc:[37.494024899390666,126.4794522413305],mode:'walk',quiz:{question:'올해 2026년 7월에 개통한 영종도와 신도를 연결하는 다리로서 여러분이 건널 다리의 이름은 무엇일까요?',choices:['모도해상교량','영종대교','인천대교','신도평화대교'],answer:3,explanation:'정답은 신도평화대교입니다. 영종도와 신도를 잇는 다리를 건너 섬으로 향합니다.'}},
  {id:'P3',name:'버스 탑승지',loc:[37.51750089288227,126.45902469933009],mode:'bus',quiz:{question:'인천광역시 옹진군 북도면에 위치한 예술과 낭만의 섬으로, 나란히 자리한 세 개의 형제 섬으로 구성된 섬 이름은 무엇일까요?',choices:['신시모도','영종무의도','강화석모도','신도장봉도'],answer:0,explanation:'정답은 신시모도입니다. 이제 셔틀버스를 타고 수기해수욕장으로 이동합니다.'}},
  {id:'P4',name:'수기해수욕장 야영장 입구',loc:[37.5444237964735,126.43149188567557],mode:'finish',quiz:{question:'2026년 9월 인천광역시가 재정비해 확정한 인천의 섬 개수는 총 몇 개일까요?',choices:['207개','168개','197개','188개'],answer:2,explanation:'정답은 197개입니다. 네 개의 퀴즈 포인트를 모두 완료했어요. 인천 피스캠프에 오신 것을 환영합니다!'}}
],geofenceMeters:35};
const key='peacecamp-2026-progress',settingsKey='peacecamp-2026-route-settings',profileKey='peacecamp-2026-profile';
const savedSettings=JSON.parse(localStorage.getItem(settingsKey)||'null');
if(savedSettings&&Array.isArray(savedSettings.points))CONFIG.points=savedSettings.points;
let profile=JSON.parse(localStorage.getItem(profileKey)||'null');if(profile?.id){profile={name:profile.name};localStorage.setItem(profileKey,JSON.stringify(profile));}let profileRequired=!profile;
let state=JSON.parse(localStorage.getItem(key)||'{"done":[]}');let map,routeLine,userMarker,accuracyCircle,watchId=null,lastFix=null,quizPoint=null,selected=-1,admin=location.search.includes('admin=1'),demo=location.search.includes('demo=1');
const $=id=>document.getElementById(id),dist=(a,b)=>{const R=6371000,p=Math.PI/180,dLat=(b[0]-a[0])*p,dLon=(b[1]-a[1])*p,x=Math.sin(dLat/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x));};
function init(){
  map=L.map('map',{zoomControl:false,attributionControl:true}).setView([37.49,126.48],10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  routeLine=L.polyline([],{color:'#276451',weight:6,opacity:.95,lineCap:'round',lineJoin:'round'}).addTo(map);
  map.on('click',e=>{if(admin)addPoint([+e.latlng.lat.toFixed(6),+e.latlng.lng.toFixed(6)]);});
  render();
  if(admin)toast('운영자 설정 모드: 지도를 눌러 퀴즈 포인트 추가');
}
function render(){
  if(!map)return;
  document.querySelectorAll('.checkpoint-pin').forEach(()=>{});
  if(window.pointLayer)map.removeLayer(window.pointLayer);window.pointLayer=L.layerGroup().addTo(map);
  CONFIG.points.forEach((p,i)=>{let icon=L.divIcon({className:'checkpoint-pin',html:`<div class="pin ${state.done.includes(p.id)?'done':''}"><span>${i+1}</span></div>`,iconSize:[29,29],iconAnchor:[14,27]});L.marker(p.loc,{icon}).addTo(window.pointLayer).bindTooltip(p.name,{direction:'top'});});
  routeLine.setLatLngs(CONFIG.route);
  if(window.transferOutline)map.removeLayer(window.transferOutline);if(window.transferLine)map.removeLayer(window.transferLine);if(CONFIG.transfer?.length){window.transferOutline=L.polyline(CONFIG.transfer,{color:'#fff',weight:9,opacity:.95,lineCap:'round',lineJoin:'round'}).addTo(map);window.transferLine=L.polyline(CONFIG.transfer,{color:'#e4a900',weight:5,opacity:1,dashArray:'2 10',lineCap:'round',lineJoin:'round'}).addTo(map);}
  const coords=[...CONFIG.route,...(CONFIG.transfer||[]),...CONFIG.points.map(p=>p.loc)];if(coords.length)map.fitBounds(coords,{padding:[35,35],maxZoom:15});
  const complete=CONFIG.points.filter(p=>state.done.includes(p.id)).length;
  $('progressText').textContent=`포인트 ${complete} / ${CONFIG.points.length}`;$('progressBar').style.width=CONFIG.points.length?`${complete/CONFIG.points.length*100}%`:'0%';
  $('pointCount').textContent=CONFIG.points.length?`${CONFIG.points.length}개 포인트`:'경로 준비 중';
  $('stopList').innerHTML=CONFIG.points.length?CONFIG.points.map((p,i)=>`<div class="stop ${state.done.includes(p.id)?'done':''}"><div class="stop-badge">${state.done.includes(p.id)?'✓':String(i+1).padStart(2,'0')}</div><div class="stop-copy"><strong>${esc(p.name)}</strong><small>${p.mode==='bus'?'🚌 버스 탑승 후 이동':p.mode==='finish'?'🏕 도착 체크인':'🚶 도보 퀴즈'} · ${p.loc[0].toFixed(4)}, ${p.loc[1].toFixed(4)}</small></div><span class="stop-state">${state.done.includes(p.id)?'완료':'대기 중'}</span></div>`).join(''):`<div class="stop"><div class="stop-badge">↗</div><div class="stop-copy"><strong>경로 좌표를 준비하고 있어요</strong><small>현장 답사 후 정확한 길과 퀴즈 지점이 표시됩니다.</small></div></div>`;
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
function save(){localStorage.setItem(key,JSON.stringify(state));render();}
function startGPS(){
  if(!profile){openProfile(true);return;}
  void prepareSound();
  if(demo){simulate();return;}
  if(!navigator.geolocation){toast('이 기기에서 위치 서비스를 사용할 수 없습니다.');return;}
  $('gpsText').textContent='위치 찾는 중…';navigator.geolocation.getCurrentPosition(pos=>onPosition(pos),err=>gpsError(err),{enableHighAccuracy:true,timeout:15000,maximumAge:0});
  if(watchId!==null)navigator.geolocation.clearWatch(watchId);
  watchId=navigator.geolocation.watchPosition(onPosition,gpsError,{enableHighAccuracy:true,timeout:20000,maximumAge:1000});
  $('startBtn').innerHTML='위치 연결됨<span class="bottom-label">걷는 중에도 위치를 확인합니다</span>';
}
function onPosition(pos){const c=[pos.coords.latitude,pos.coords.longitude];lastFix={loc:c,accuracy:pos.coords.accuracy,time:Date.now()};$('gpsDot').classList.add('on');$('gpsText').textContent=pos.coords.accuracy>60?`위치 오차 약 ${Math.round(pos.coords.accuracy)}m`:'GPS 위치 연결됨';if(!userMarker){userMarker=L.marker(c,{icon:L.divIcon({className:'',html:'<svg viewBox="0 0 36 42" width="36" height="42" aria-label="현재 위치"><path d="M8 38V4" stroke="white" stroke-width="6" stroke-linecap="round"/><path d="M8 5H31L25 14L31 23H8Z" fill="#1d6ab4" stroke="white" stroke-width="2.5" stroke-linejoin="round"/><circle cx="8" cy="37" r="4" fill="#1d6ab4" stroke="white" stroke-width="2"/></svg>',iconSize:[36,42],iconAnchor:[8,40]})}).addTo(map);}else userMarker.setLatLng(c);if(accuracyCircle)map.removeLayer(accuracyCircle);accuracyCircle=L.circle(c,{radius:Math.min(pos.coords.accuracy,120),color:'#3488ff',weight:1,fillOpacity:.07}).addTo(map);if(!window.centered){map.setView(c,15);window.centered=true;}checkGeofence(c,pos.coords.accuracy);}
function gpsError(e){$('gpsText').textContent='위치 권한 확인';$('gpsDot').classList.remove('on');toast(e.code===1?'브라우저 설정에서 위치 권한을 허용해 주세요.':'GPS 신호가 약합니다. 잠시 후 다시 시도해 주세요.');}
function checkGeofence(c,accuracy){if(accuracy>80)return;const candidate=CONFIG.points.find(p=>!state.done.includes(p.id)&&p.mode!=='finish'&&dist(c,p.loc)<=CONFIG.geofenceMeters);if(candidate&&candidate.id!==quizPoint?.id)openQuiz(candidate,true);const finish=CONFIG.points.find(p=>p.mode==='finish'&&!state.done.includes(p.id)&&dist(c,p.loc)<=CONFIG.geofenceMeters);if(finish&&CONFIG.points.filter(p=>p.mode!=='finish').every(p=>state.done.includes(p.id))&&finish.id!==quizPoint?.id)openQuiz(finish,true);}
let alertAudio=null,soundEnabled=localStorage.getItem('peacecamp-2026-sound')!=='off';
function updateSoundButton(){const b=$('soundBtn');b.textContent=soundEnabled?'🔊':'🔇';b.setAttribute('aria-pressed',String(soundEnabled));b.setAttribute('aria-label',soundEnabled?'퀴즈 알림음 끄기':'퀴즈 알림음 켜기');}
async function prepareSound(){if(!soundEnabled)return false;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;if(!alertAudio)alertAudio=new AC();const resume=alertAudio.state==='running'?Promise.resolve():alertAudio.resume();const silent=alertAudio.createBufferSource();silent.buffer=alertAudio.createBuffer(1,1,alertAudio.sampleRate);silent.connect(alertAudio.destination);silent.start();await resume;return alertAudio.state==='running';}catch{return false;}}
async function playArrivalSound(){if(!soundEnabled||!alertAudio)return;try{if(alertAudio.state==='suspended')await alertAudio.resume();if(alertAudio.state!=='running'||!soundEnabled)return;const now=alertAudio.currentTime;[[784,0,.13],[1046.5,.18,.22]].forEach(([frequency,offset,duration])=>{const oscillator=alertAudio.createOscillator(),gain=alertAudio.createGain(),at=now+offset;oscillator.type='sine';oscillator.frequency.value=frequency;gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(.16,at+.015);gain.gain.exponentialRampToValueAtTime(.001,at+duration);oscillator.connect(gain);gain.connect(alertAudio.destination);oscillator.onended=()=>{oscillator.disconnect();gain.disconnect();};oscillator.start(at);oscillator.stop(at+duration+.02);});}catch{}}
function toggleSound(){soundEnabled=!soundEnabled;localStorage.setItem('peacecamp-2026-sound',soundEnabled?'on':'off');updateSoundButton();if(soundEnabled)prepareSound().then(ok=>{if(ok){void playArrivalSound();toast('퀴즈 알림음을 켰어요.');}else toast('알림음을 준비하지 못했어요. 다시 눌러 주세요.');});else toast('퀴즈 알림음을 껐어요.');}
function pulse(pattern){if(typeof navigator.vibrate!=='function')return false;try{return navigator.vibrate(pattern);}catch{return false;}}
function openQuiz(p,arrival=false){if(!p.quiz?.question){toast(`${p.name}에 도착했어요.`);return;}quizPoint=p;selected=-1;showSheet(`<div class="sheet-top"><div><div class="sheet-kicker">PEACE TRAIL · QUIZ</div><h2>${esc(p.name)}</h2></div><button class="close" data-close>×</button></div><p>${esc(p.quiz.question)}</p><div>${(p.quiz.choices||[]).map((c,i)=>`<button class="choice" data-choice="${i}">${String.fromCharCode(9312+i)} ${esc(c)}</button>`).join('')}</div><button class="sheet-btn" id="answerBtn">정답 확인</button>`,true);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-choice]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=+b.dataset.choice;});$('answerBtn').onclick=answer;if(arrival){pulse([200,120,200]);void playArrivalSound();}}
function answer(){if(selected<0){toast('답을 선택해 주세요.');return;}const correct=selected===Number(quizPoint.quiz.answer);const p=quizPoint;if(correct){if(!state.done.includes(p.id))state.done.push(p.id);save();}showSheet(`<div class="sheet-kicker">${correct?'POINT CLEARED':'TRY AGAIN'}</div><h2>${correct?'정답이에요!':'아쉬워요, 다시 생각해 볼까요?'}</h2><p>${correct?esc(p.quiz.explanation||'좋아요! 다음 포인트로 걸음을 이어가세요.'):esc(p.quiz.hint||'주변 풍경과 안내를 살펴보고 다시 도전해 보세요.')}</p><button class="sheet-btn" id="resultBtn">${correct?'다음 포인트 보기':'다시 도전'}</button>`,true);$('resultBtn').onclick=()=>correct?hideSheet():openQuiz(p);if(correct)pulse([80,40,100]);}
function showSheet(html,center=false){$('sheet').className='sheet'+(center?' center':'');$('sheet').innerHTML=html;$('overlay').classList.add('show');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=hideSheet);}
function hideSheet(){if(profileRequired&&!profile){toast('먼저 이름과 참가자 ID를 입력해 주세요.');return;}$('overlay').classList.remove('show');quizPoint=null;}
function openProfile(first=false){profileRequired=first&&!profile;showSheet(`<div class="sheet-top"><div><div class="sheet-kicker">WELCOME TO PEACE CAMP</div><h2>${profileRequired?'이름을 입력해 주세요':'참가자 정보'}</h2></div>${profileRequired?'':'<button class="close" data-close>×</button>'}</div><p>이름을 입력하면 트레킹을 시작할 수 있어요. 입력한 이름은 현재 브라우저에 저장되며 운영진에게 전송되지 않습니다.</p><div class="field"><label for="participantName">이름</label><input id="participantName" maxlength="30" autocomplete="name" placeholder="이름을 입력해 주세요" value="${esc(profile?.name||'')}" /></div><button class="sheet-btn" id="saveProfileBtn">${profileRequired?'이름 입력하고 시작하기':'저장'}</button>`,true);$('saveProfileBtn').onclick=saveProfile;}
function saveProfile(){const name=$('participantName').value.trim();if(!name){toast('이름을 입력해 주세요.');return;}profile={name};localStorage.setItem(profileKey,JSON.stringify(profile));profileRequired=false;$('profileBtn').textContent=`${name}님`;hideSheet();toast(`${name}님, 환영합니다!`);}
function simulate(){if(!CONFIG.points.length){toast('시연 포인트를 먼저 등록해 주세요.');return;}const p=CONFIG.points.find(x=>!state.done.includes(x.id))||CONFIG.points[0];onPosition({coords:{latitude:p.loc[0],longitude:p.loc[1],accuracy:8}});map.setView(p.loc,17);toast(`${p.name} 도착 상황을 시연합니다.`);}
function help(){showSheet(`<div class="sheet-top"><div><div class="sheet-kicker">WALK WITH CARE</div><h2>평화길 이용 방법</h2></div><button class="close" data-close>×</button></div><p>위치 권한을 허용하고 트레킹을 시작하세요. 퀴즈 포인트에 도착하면 화면에 문제가 나타납니다. 이동 중에는 화면을 조작하지 말고 안전한 곳에 멈춰 풀어주세요.</p><p>진행상황은 이 기기의 브라우저에 저장됩니다. 브라우저 데이터를 지우거나 다른 기기로 열면 진행상황이 이어지지 않습니다.</p><button class="sheet-btn" data-close>확인했어요</button>`,true);}
function addPoint(loc){const num=CONFIG.points.length+1,name=prompt(`포인트 ${num} 이름`,'평화길 포인트 '+num);if(!name)return;const q=prompt('퀴즈 문제 (취소하면 문제 없이 저장)','이 장소에서 발견할 수 있는 풍경은 무엇인가요?');const p={id:'P'+Date.now(),name,loc,quiz:q?{question:q,choices:['바다','숲','마을','하늘'],answer:0,explanation:'좋습니다. 다음 포인트로 이동해요.'}:null};CONFIG.points.push(p);persistSettings();render();toast('포인트를 추가했어요.');}
function persistSettings(){localStorage.setItem(settingsKey,JSON.stringify({route:CONFIG.route,transfer:CONFIG.transfer,points:CONFIG.points}));}
function openAdmin(){showSheet(`<div class="sheet-top"><div><div class="sheet-kicker">ORGANIZER TOOLS</div><h2>경로·퀴즈 설정</h2></div><button class="close" data-close>×</button></div><p>현장 답사 경로(GPX)를 불러오고 지도에서 퀴즈 포인트를 추가하세요. 이 브라우저에 설정이 저장됩니다. 참가자에게 배포할 때는 아래 설정 파일을 내려받아 앱 설정(CONFIG)에 반영해야 합니다.</p><div class="field"><label>GPX 경로 불러오기</label><input id="gpxFile" type="file" accept=".gpx,application/gpx+xml" /></div><div class="field"><label>GPS 퀴즈 반경 (m)</label><input id="radius" type="number" min="10" max="100" value="${CONFIG.geofenceMeters}" /></div><div class="admin-list">${CONFIG.points.map((p,i)=>`<div class="admin-item"><span>${i+1}. ${esc(p.name)} <span class="tiny">${p.loc.join(', ')}</span></span><button class="danger" data-remove="${i}">삭제</button></div>`).join('')||'<div class="tiny">아직 등록된 포인트가 없습니다. 지도에서 위치를 눌러 추가하세요.</div>'}</div><div class="admin-row"><button class="sheet-btn light" id="exportBtn">설정 JSON 저장</button><button class="sheet-btn light" id="clearBtn">전체 초기화</button></div><button class="sheet-btn" data-close>완료</button>`,true);$('gpxFile').onchange=loadGPX;$('radius').onchange=e=>{CONFIG.geofenceMeters=Math.max(10,Math.min(100,+e.target.value||35));};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{CONFIG.points.splice(+b.dataset.remove,1);persistSettings();openAdmin();render();});$('exportBtn').onclick=exportConfig;$('clearBtn').onclick=()=>{if(confirm('경로와 포인트 설정을 모두 지울까요?')){CONFIG.points=[];CONFIG.route=[];state={done:[]};localStorage.removeItem(settingsKey);save();openAdmin();}};}
function loadGPX(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{const doc=new DOMParser().parseFromString(reader.result,'application/xml');const pts=[...doc.querySelectorAll('trkpt,rtept,wpt')].map(n=>[+n.getAttribute('lat'),+n.getAttribute('lon')]).filter(p=>Number.isFinite(p[0])&&Number.isFinite(p[1]));if(pts.length<2){toast('GPX 경로를 읽지 못했어요.');return;}CONFIG.route=pts;persistSettings();render();map.fitBounds(pts,{padding:[30,30]});toast(`GPX 경로 ${pts.length}개 좌표를 불러왔어요.`);};reader.readAsText(f);}
function exportConfig(){const payload={event:CONFIG.event,geofenceMeters:CONFIG.geofenceMeters,route:CONFIG.route,transfer:CONFIG.transfer,points:CONFIG.points};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download='peace-camp-route-config.json';a.click();URL.revokeObjectURL(a.href);}
function share(){if(navigator.share)navigator.share({title:'인천 피스캠프 평화길 트레킹',text:'GPS 퀴즈 트레킹 웹앱을 열어보세요.',url:location.href});else navigator.clipboard?.writeText(location.href).then(()=>toast('링크를 복사했어요.')).catch(()=>toast('주소창에서 링크를 복사해 주세요.'));}
$('soundBtn').onclick=toggleSound;updateSoundButton();$('startBtn').onclick=startGPS;$('helpBtn').onclick=help;$('profileBtn').onclick=()=>openProfile(false);$('shareBtn').onclick=share;$('recenter').onclick=()=>lastFix?map.setView(lastFix.loc,16):startGPS();$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))hideSheet();});window.addEventListener('keydown',e=>{if(admin&&e.altKey&&e.key.toLowerCase()==='o')openAdmin();});
if(admin){$('helpBtn').textContent='운영 설정';$('helpBtn').onclick=openAdmin;}
init();
if(profile){$('profileBtn').textContent=`${profile.name}님`;}else openProfile(true);
</script>
</body>
</html>
